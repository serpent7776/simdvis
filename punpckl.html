<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUNPCKLBW / PUNPCKLWD / PUNPCKLDQ / PUNPCKLQDQ — Interactive Unpack-Low Visualiser</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg2: #f5f5f3;
    --bg3: #eeede8;
    --text: #1a1a18;
    --text2: #5f5e5a;
    --text3: #888780;
    --border: rgba(0,0,0,0.12);
    --border2: rgba(0,0,0,0.22);
    --font-mono: ui-monospace, 'Cascadia Code', 'Fira Mono', monospace;
    --font-sans: system-ui, -apple-system, sans-serif;
    --radius: 8px;
    --radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1c;
      --bg2: #272725;
      --bg3: #2e2e2c;
      --text: #e8e6df;
      --text2: #9c9a92;
      --text3: #6e6c66;
      --border: rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.2);
    }
  }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .card {
    background: var(--bg);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    width: 100%;
    max-width: 920px;
  }

  .tabs { display: flex; gap: 4px; margin-bottom: 1rem; flex-wrap: wrap; }
  .tab {
    font-size: 11px; padding: 5px 10px; border-radius: 6px;
    border: 0.5px solid var(--border); background: var(--bg2);
    color: var(--text2); cursor: pointer;
    font-family: var(--font-mono); font-weight: 500;
    transition: background .15s, border-color .15s, color .15s;
  }
  .tab:hover { background: var(--bg3); border-color: var(--border2); color: var(--text); }
  .tab.active {
    background: var(--bg); color: var(--text);
    border-color: var(--border2); font-weight: 600;
    box-shadow: inset 0 -2px 0 var(--text2);
  }

  .header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: .25rem; }
  .title { font-size: 15px; font-weight: 500; }
  .subtitle { font-size: 12px; color: var(--text2); margin-bottom: 1rem; }

  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 500; font-family: var(--font-mono); }
  .bb { background: #B5D4F4; color: #042C53; }
  .ba { background: #FAC775; color: #412402; }
  .bg { background: #C0DD97; color: #173404; }
  .bt { background: #B9E4E2; color: #0A3E3B; }
  .bp { background: #D8C9F4; color: #2A1356; }
  .bz { background: #D3D1C7; color: #2C2C2A; }

  @media (prefers-color-scheme: dark) {
    .bb { background: #0C447C; color: #B5D4F4; }
    .ba { background: #633806; color: #FAC775; }
    .bg { background: #27500A; color: #C0DD97; }
    .bt { background: #0E4B47; color: #B9E4E2; }
    .bp { background: #3A2070; color: #D8C9F4; }
    .bz { background: #444441; color: #D3D1C7; }
  }

  /* each grid row is one 128-bit lane — a slightly larger row gap keeps lanes apart */
  .reg-grid { display: grid; grid-template-columns: repeat(var(--cols, 4), 1fr); column-gap: 3px; row-gap: 6px; }

  .cell {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 6px; border: 0.5px solid; font-family: var(--font-mono);
    font-size: 11px; font-weight: 500; transition: background .15s, box-shadow .15s;
    min-width: 0; position: relative; height: 46px;
  }
  .cell-idx { font-size: 9px; font-weight: 400; opacity: .55; margin-bottom: 1px; }
  .cell-val { font-size: 11px; line-height: 1; overflow: hidden; text-overflow: ellipsis; max-width: 100%; white-space: nowrap; }

  .src-cell  { background: #E6F1FB; border-color: #378ADD; color: #0C447C; cursor: pointer; }
  .src-cell:hover { background: #B5D4F4; }
  .src2-cell { background: #DFF1F0; border-color: #2E8B87; color: #0A3E3B; cursor: pointer; }
  .src2-cell:hover { background: #B9E4E2; }
  /* the high half of every lane is never read by an unpack-low: fade it out */
  .src-cell.idle, .src2-cell.idle {
    background: var(--bg2); border-style: dashed; border-color: var(--border2); color: var(--text3);
  }
  .src-cell.idle:hover, .src2-cell.idle:hover { background: var(--bg3); }
  .src-cell.lit, .src2-cell.lit { background: #FAC775; border-color: #EF9F27; color: #412402; box-shadow: 0 0 0 2px #EF9F27; }

  .km-cell  { background: #EEE7FA; border-color: #8367C7; color: #2A1356; cursor: pointer; height: 32px; }
  .km-cell:hover { background: #D8C9F4; }
  .km-cell.km-off { background: #F1EFE8; border-color: #888780; color: #5F5E5A; }
  .km-cell.km-off:hover { background: #E4E1D5; }
  .km-cell.active { box-shadow: 0 0 0 2.5px #8367C7; }

  /* dst: copied from src1 (blue tint) / from src2 (teal tint) / masked off */
  .dst-a    { background: #E6F1FB; border-color: #378ADD; color: #0C447C; cursor: default; }
  .dst-b    { background: #DFF1F0; border-color: #2E8B87; color: #0A3E3B; cursor: default; }
  .dst-zer  { background: #F1EFE8; border-color: #888780; color: #5F5E5A; cursor: default; }
  .dst-keep { background: #F4F0FA; border-color: #8367C7; color: #2A1356; cursor: default; }

  @media (prefers-color-scheme: dark) {
    .src-cell  { background: #0C447C; border-color: #378ADD; color: #B5D4F4; }
    .src-cell:hover { background: #185FA5; }
    .src2-cell { background: #0E4B47; border-color: #2E8B87; color: #B9E4E2; }
    .src2-cell:hover { background: #14625D; }
    .src-cell.idle, .src2-cell.idle { background: var(--bg2); border-color: var(--border2); color: var(--text3); }
    .src-cell.idle:hover, .src2-cell.idle:hover { background: var(--bg3); }
    .src-cell.lit, .src2-cell.lit { background: #633806; border-color: #EF9F27; color: #FAC775; box-shadow: 0 0 0 2px #EF9F27; }
    .km-cell  { background: #3A2070; border-color: #8367C7; color: #D8C9F4; }
    .km-cell:hover { background: #4F2D94; }
    .km-cell.km-off { background: #2C2C2A; border-color: #5F5E5A; color: #888780; }
    .km-cell.km-off:hover { background: #3A3A38; }
    .dst-a    { background: #0C447C; border-color: #378ADD; color: #B5D4F4; }
    .dst-b    { background: #0E4B47; border-color: #2E8B87; color: #B9E4E2; }
    .dst-zer  { background: #2C2C2A; border-color: #5F5E5A; color: #888780; }
    .dst-keep { background: #3A2070; border-color: #8367C7; color: #D8C9F4; }
  }

  .row-lbl { font-size: 11px; color: var(--text2); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .hint { font-size: 11px; color: var(--text3); }
  .gap { height: 34px; }

  .flow { position: relative; }
  /* behind the cells: the wires show in the row gaps and pass cleanly under the
     opaque cell backgrounds instead of drawing over src2's values */
  .flow canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .flow .reg-grid, .flow .row-lbl { position: relative; z-index: 1; }

  .info {
    font-size: 12px; color: var(--text2);
    background: var(--bg2); border: 0.5px solid var(--border);
    border-radius: var(--radius); padding: 9px 13px; line-height: 1.6; min-height: 40px;
    margin-top: .75rem;
  }
  .info strong { color: var(--text); }
  .info code { font-family: var(--font-mono); font-size: 11px; }

  select {
    font-size: 11px; padding: 2px 5px; border-radius: 5px;
    border: 0.5px solid var(--border2);
    background: var(--bg2); color: var(--text);
  }
  .ctl { font-size: 11px; color: var(--text2); display: flex; align-items: center; gap: 5px; }
  /* keep the selectors together so they wrap as a right-aligned group */
  .ctls { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 8px; margin-left: auto; }

  .popup {
    position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    background: var(--bg); border: 0.5px solid var(--border2);
    border-radius: var(--radius); padding: 8px; z-index: 50;
    display: flex; flex-direction: column; gap: 5px; min-width: 170px;
    box-shadow: 0 4px 16px rgba(0,0,0,.12);
  }
  .popup-lbl { font-size: 10px; color: var(--text3); font-family: var(--font-mono); }
  .popup input[type=text] {
    font-family: var(--font-mono); font-size: 12px; width: 100%;
    padding: 4px 7px; border-radius: 4px; border: 0.5px solid var(--border2);
    background: var(--bg2); color: var(--text);
  }
  .popup-row { display: flex; gap: 4px; }
  .popup button {
    font-size: 11px; padding: 3px 8px; border-radius: 4px;
    border: 0.5px solid var(--border2); background: var(--bg2); color: var(--text);
    cursor: pointer; flex: 1;
  }
  .popup button:hover { background: var(--bg3); }
  .quick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px; }
  .quick-grid button { font-size: 10px; font-family: var(--font-mono); padding: 2px 0; flex: unset; }

  footer {
    margin-top: 1.5rem; padding-top: 1rem;
    border-top: 0.5px solid var(--border);
    font-size: 11px; color: var(--text3);
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
  footer a { color: var(--text3); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  footer a:hover { color: var(--text2); }
  .gh-icon { width: 14px; height: 14px; fill: currentColor; }
</style>
</head>
<body>
<div class="card">

  <div class="tabs" id="tabs"></div>

  <div class="header">
    <span class="title" id="title"></span>
    <span class="badge bb" id="isa-badge"></span>
    <span class="badge bz" id="width-badge"></span>
    <span class="ctls">
    <label class="ctl">
      Width:
      <select id="width" onchange="changeWidth(this.value)"></select>
    </label>
    <label class="ctl">
      Mask:
      <select id="kmode" onchange="changeKmaskMode(this.value)">
        <option value="off">none</option>
        <option value="merge">{k1} merge</option>
        <option value="zero">{k1}{z} zero</option>
      </select>
    </label>
    </span>
  </div>
  <p class="subtitle" id="subtitle"></p>

  <div class="flow" id="flow">
    <div class="row-lbl"><span class="badge bb">src1</span><span class="hint" id="src1-hint"></span></div>
    <div class="reg-grid" id="src1-grid"></div>
    <div class="gap"></div>
    <div class="row-lbl"><span class="badge bt">src2</span><span class="hint" id="src2-hint"></span></div>
    <div class="reg-grid" id="src2-grid"></div>
    <div class="gap"></div>
    <div id="kmask-row" hidden>
      <div class="row-lbl"><span class="badge bp">k1</span><span class="hint kmask-hint">click to toggle 0/1</span></div>
      <div class="reg-grid" id="kmask-grid"></div>
      <div style="height:10px"></div>
    </div>
    <div class="row-lbl"><span class="badge bg">dst</span><span class="hint" id="dst-hint"></span></div>
    <div class="reg-grid" id="dst-grid"></div>
    <canvas id="arrows"></canvas>
  </div>

  <div class="info" id="info">Hover over any cell to trace the interleave.</div>

  <footer>
    <a href="index.html">&larr; All visualisers</a>
    <a href="https://github.com/serpent7776/simdvis">
      <svg class="gh-icon" viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.64 7.64 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      simdvis
    </a>
    <a id="isa-ref" target="_blank" rel="noopener">Intel ISA reference ↗</a>
  </footer>
</div>

<script>
// ─── Instruction configurations ─────────────────────────────────────────────
// PUNPCKL* interleaves ("unpacks") the *low* half of src1 with the low half of
// src2. Within every 128-bit lane, for j below half the lane's element count:
//
//   dst[2j]   = src1[j]
//   dst[2j+1] = src2[j]
//
// The high half of each lane in both sources is never read — that is what the
// PUNPCKH* twins do. The suffix names the source→destination element size
// (BW = bytes become word pairs, and so on) but the data is only moved, never
// widened: the classic zero-extension idiom pairs each byte with a 0x00 byte
// from a zeroed src2 register.
//
// The VEX (AVX/AVX2) forms are the same operation on wider registers, still
// lane by lane. The EVEX (AVX-512) forms add a {k1} write-mask with merge or
// zero semantics on the destination.
//
//   bytes    : element size
//   f512     : AVX-512 feature providing the EVEX form
const SIZES = [
  { key:'bw',  name:'BW',  bytes:1, elemName:'byte',  f512:'AVX-512BW' },
  { key:'wd',  name:'WD',  bytes:2, elemName:'word',  f512:'AVX-512BW' },
  { key:'dq',  name:'DQ',  bytes:4, elemName:'dword', f512:'AVX-512F'  },
  { key:'qdq', name:'QDQ', bytes:8, elemName:'qword', f512:'AVX-512F'  },
];
const SIZE_BY_KEY = {};
for(const s of SIZES) SIZE_BY_KEY[s.key] = s;

// Parse a deep-link hash like "punpcklbw" / "vpunpckldq" → { key:'bw' }, or null.
function parseHash(h){
  const m = /^v?punpckl(bw|wd|dq|qdq)$/.exec(h);
  return m ? { key: m[1] } : null;
}

// ─── State ──────────────────────────────────────────────────────────────────
let SZ;                      // current size descriptor from SIZES
let N, LANE, HALF;           // N = element count; LANE = elements per 128-bit lane; HALF = LANE/2
let kmode = 'off';           // 'off' | 'merge' | 'zero' — EVEX write-mask
let src1, src2, kmask, dstPrev;
let hovSrc1 = -1, hovSrc2 = -1, hovDst = -1, hovK = -1;
let cells;  // { src1:[…], src2:[…], dst:[…], k1:[…] }

// ─── Instruction metadata ───────────────────────────────────────────────────
function instrName(){ return 'punpckl' + SZ.key; }
function baseTitle(){ return 'PUNPCKL' + SZ.name; }
// The legacy (SSE2) encoding only exists at 128 bits without a mask.
function legacyForm(){ return bitsTotal() === 128 && kmode === 'off'; }
function instrTitle(){
  return legacyForm() ? baseTitle() + ' / V' + baseTitle() : 'V' + baseTitle();
}
function instrRef(){ return 'https://www.felixcloutier.com/x86/punpcklbw:punpcklwd:punpckldq:punpcklqdq'; }
function instrSubtitle(){
  const wide = bitsTotal() > 128;
  const laneNote = wide
    ? ` Each 128-bit lane is unpacked independently — nothing crosses a lane.`
    : '';
  const idiom = SZ.key === 'bw'
    ? ` With a zeroed <code>src2</code> this zero-extends the lower ${wide ? 'bytes of each lane' : '8 bytes'} to words — the ${legacyForm() ? 'classic SSE2 ' : ''}companion of <code>PUNPCKHBW</code> for the upper half.`
    : SZ.key === 'qdq'
      ? (wide
          ? ` With one qword per half, each lane simply concatenates its low qwords: <code>[src1.lo, src2.lo]</code>.`
          : ` With one qword per half, this simply concatenates the low qwords: <code>dst = [src1[0], src2[0]]</code>.`)
      : '';
  const what = HALF > 1
    ? `the low ${HALF} ${SZ.elemName}s of <code>src1</code> with the low ${HALF} of <code>src2</code>`
    : `the low ${SZ.elemName} of <code>src1</code> with the low ${SZ.elemName} of <code>src2</code>`;
  return `Interleave ${what}${wide ? ' in every 128-bit lane' : ''}: <code>dst[2j] = src1[j]</code>, <code>dst[2j+1] = src2[j]</code> (j counted within the lane). The high half of each source is ignored (that is <code>PUNPCKH${SZ.name}</code>'s job).${laneNote}${idiom}`;
}

// ─── Helpers ────────────────────────────────────────────────────────────────
function hexW(){ return SZ.bytes * 2; }
function zeroStr(){ return '0x' + '0'.repeat(hexW()); }
function keepFill(){ return 'CC'.repeat(SZ.bytes); }
function bitsTotal(){ return N * SZ.bytes * 8; }
function regNameForBits(bits){ return bits === 128 ? 'XMM' : bits === 256 ? 'YMM' : 'ZMM'; }
function widthsFor(){ return [16 / SZ.bytes, 32 / SZ.bytes, 64 / SZ.bytes]; }
function normHex(raw){
  const s = raw.trim().replace(/^0x/i, '');
  if(!/^[0-9a-fA-F]+$/.test(s) || s.length > hexW()) return null;
  return s.toUpperCase().padStart(hexW(), '0');
}
// Widen a byte into a full element by repeating it, so a value stays readable
// at any element size (0x5A → 0x5A5A5A5A).
function fillHex(b){ return b.toString(16).toUpperCase().padStart(2, '0').repeat(SZ.bytes); }

function isaLabel(){
  const bits = bitsTotal();
  if(bits === 512) return SZ.f512;
  if(kmode === 'off') return bits === 128 ? 'SSE2 / AVX' : 'AVX2';
  return SZ.f512 + '+VL';
}
function widthLabel(){ const bits = bitsTotal(); return `${bits}-bit ${regNameForBits(bits)}`; }

// ─── Index mapping ──────────────────────────────────────────────────────────
function laneOf(i){ return (i / LANE) | 0; }
function locOf(i){ return i % LANE; }
// Is source element j in the low half of its lane (and therefore read)?
function srcUsed(j){ return locOf(j) < HALF; }
// Destination slots fed by source pair j: [from src1, from src2]. Only valid when srcUsed(j).
function dstOfPair(j){ const d = laneOf(j) * LANE + 2 * locOf(j); return [d, d + 1]; }
// Where does dst[i] come from? → { from:'src1'|'src2', j }
function srcOfDst(i){ return { from: locOf(i) % 2 ? 'src2' : 'src1', j: laneOf(i) * LANE + (locOf(i) >> 1) }; }
function srcVal(from, j){ return (from === 'src1' ? src1 : src2)[j]; }

function writes(i){ return !(kmode !== 'off' && !kmask[i]); }

// What ends up in dst[i]?
//   { kind:'val', from, j, val }  — copied source element
//   { kind:'zero' }               — masked out with {z}
//   { kind:'keep', val }          — masked out with merge, prior dst kept
function dstStatus(i){
  if(!writes(i)) return kmode === 'zero' ? { kind:'zero' } : { kind:'keep', val: dstPrev[i] };
  const { from, j } = srcOfDst(i);
  return { kind:'val', from, j, val: srcVal(from, j) };
}

// ─── Seed data ──────────────────────────────────────────────────────────────
// Two disjoint ranges so every element is recognisable in the interleaved
// result: src1 counts up from 0xA0, src2 from 0x10.
function seed1(i){ return fillHex((0xA0 + i) & 0xff); }
function seed2(i){ return fillHex((0x10 + i) & 0xff); }

function initData(n){
  N = n;
  src1    = Array.from({length:N}, (_,i) => seed1(i));
  src2    = Array.from({length:N}, (_,i) => seed2(i));
  kmask   = Array.from({length:N}, () => 1);
  dstPrev = Array.from({length:N}, () => keepFill());
}

// ─── Init / switching ───────────────────────────────────────────────────────
function selectSize(key){
  SZ = SIZE_BY_KEY[key] || SIZES[0];
  LANE = 16 / SZ.bytes;               // elements per 128-bit lane = columns
  HALF = LANE / 2;
  N = widthsFor()[0];                 // default to 128-bit (the legacy instruction)
  kmode = 'off';
  hovSrc1 = hovSrc2 = hovDst = hovK = -1;
  closePopup();
  initData(N);

  rebuildWidthOptions();
  document.getElementById('kmode').value = 'off';
  build();
  updatePresentation();
  render(); drawArrows();
}

function rebuildWidthOptions(){
  const sel = document.getElementById('width');
  sel.innerHTML = '';
  for(const w of widthsFor()){
    const opt = document.createElement('option');
    opt.value = w;
    const bits = w * SZ.bytes * 8;
    opt.textContent = `${regNameForBits(bits)} (${bits})`;
    sel.appendChild(opt);
  }
  sel.value = N;
}

// Show `newN` elements. The operand arrays only ever grow — everything below N
// is left alone, so narrowing the width and coming back keeps the user's edits.
function resizeTo(newN){
  for(let i = src1.length; i < newN; i++){
    src1.push(seed1(i)); src2.push(seed2(i)); kmask.push(1); dstPrev.push(keepFill());
  }
  N = newN;
}

function changeWidth(w){
  const newN = parseInt(w);
  if(newN === N) return;
  hovSrc1 = hovSrc2 = hovDst = hovK = -1;  // a stale index could exceed the shrunk element count
  closePopup();
  resizeTo(newN);
  build();
  updatePresentation();
  render(); drawArrows();
}

function changeKmaskMode(m){
  if(m === kmode) return;
  kmode = m;
  document.getElementById('kmask-row').hidden = (kmode === 'off');
  updateKmaskHint();
  updatePresentation();
  render(); drawArrows();
}

function updateKmaskHint(){
  const txt = kmode === 'zero'  ? `click to toggle 0/1 — 0 zeroes the output ${SZ.elemName}`
            : kmode === 'merge' ? `click to toggle 0/1 — 0 keeps the prior dst ${SZ.elemName}`
                                : 'click to toggle 0/1 — 1 = element active';
  document.querySelector('.kmask-hint').textContent = txt;
}

function syncBadges(){
  document.getElementById('isa-badge').textContent = isaLabel();
  document.getElementById('width-badge').textContent = widthLabel();
}

// Refresh everything that depends on (SZ, kmode, N) but not on cell geometry.
function updatePresentation(){
  document.title = instrTitle() + ' — Interactive Unpack-Low Visualiser';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.instr === SZ.key));
  document.getElementById('kmode').value = kmode;
  document.getElementById('title').textContent = instrTitle();
  document.getElementById('subtitle').innerHTML = instrSubtitle();
  document.getElementById('isa-ref').href = instrRef();
  // Indices in the hint are lane-relative — the cells show register-global ones.
  const jRange = HALF > 1 ? `j &lt; ${HALF}` : 'j = 0';
  document.getElementById('dst-hint').innerHTML = N > LANE
    ? `per 128-bit lane: dst[2j] = src1[j] · dst[2j+1] = src2[j] — ${jRange}, counted from the start of the lane`
    : `dst[2j] = src1[j] · dst[2j+1] = src2[j] — ${jRange}`;
  syncBadges();
  // The hash names the size tab only — both spellings (#punpcklbw and
  // #vpunpcklbw) select it, so leave whichever one the user arrived with.
  const cur = parseHash(location.hash.replace(/^#/, ''));
  if(!cur || cur.key !== SZ.key) history.replaceState(null, '', '#' + instrName());
}

// ─── Construction ───────────────────────────────────────────────────────────
// Cells are built once per build() and cached in `cells`. render() updates only
// data-dependent attributes; refreshHover() updates only hover styling.
function makeCell(idxLabel){
  const el = document.createElement('div');
  el.innerHTML = `<span class="cell-idx">${idxLabel}</span><span class="cell-val"></span>`;
  el._val = el.lastChild;
  return el;
}

function buildSrcRow(gridId, arrName, cls){
  const g = document.getElementById(gridId);
  g.style.setProperty('--cols', LANE);
  g.innerHTML = '';
  const out = [];
  for(let i=0; i<N; i++){
    const el = makeCell(`[${i}]`);
    el.className = 'cell ' + cls + (srcUsed(i) ? '' : ' idle');
    el.onclick = () => openSrcPopup(arrName, i, el, g);
    wireHover(el, () => { if(arrName === 'src1') hovSrc1 = i; else hovSrc2 = i; });
    g.appendChild(el);
    out.push(el);
  }
  return out;
}

function build(){
  closePopup();
  cells = { src1: [], src2: [], dst: [], k1: [] };

  const lanes = N / LANE;
  const read = HALF > 1 ? `only the low ${HALF} ${SZ.elemName}s of each lane are read` : `only the low ${SZ.elemName} of each lane is read`;
  const hint = `${bitsTotal()}-bit source (${N} ${SZ.elemName}s${lanes > 1 ? `, one 128-bit lane per row` : ''}) — ${read} · click a ${SZ.elemName} to edit`;
  document.getElementById('src1-hint').textContent = hint;
  document.getElementById('src2-hint').textContent = hint;

  cells.src1 = buildSrcRow('src1-grid', 'src1', 'src-cell');
  cells.src2 = buildSrcRow('src2-grid', 'src2', 'src2-cell');

  const dstG = document.getElementById('dst-grid');
  dstG.style.setProperty('--cols', LANE);
  dstG.innerHTML = '';
  for(let i=0; i<N; i++){
    const el = makeCell(`[${i}]`);
    wireHover(el, () => hovDst = i);
    dstG.appendChild(el);
    cells.dst.push(el);
  }

  const kG = document.getElementById('kmask-grid');
  document.getElementById('kmask-row').hidden = (kmode === 'off');
  kG.style.setProperty('--cols', LANE);
  kG.innerHTML = '';
  for(let i=0; i<N; i++){
    const el = makeCell(`[${i}]`);
    el.onclick = () => { kmask[i] = kmask[i] ? 0 : 1; hovK = i; render(); drawArrows(); updateInfo(); };
    wireHover(el, () => hovK = i);
    kG.appendChild(el);
    cells.k1.push(el);
  }
  updateKmaskHint();
}

// Wire hover on a cell: clear all hover state, set the one this cell owns, redraw.
function wireHover(el, setHov){
  el.addEventListener('mouseenter', () => { hovSrc1=hovSrc2=hovDst=hovK=-1; setHov(); refreshHover(); drawArrows(); updateInfo(); });
  el.addEventListener('mouseleave', () => { hovSrc1=hovSrc2=hovDst=hovK=-1; refreshHover(); drawArrows(); resetInfo(); });
}

// ─── Rendering ──────────────────────────────────────────────────────────────
function render(){
  for(let i=0; i<N; i++){
    const a = cells.src1[i], b = cells.src2[i];
    a._val.textContent = '0x' + src1[i];
    b._val.textContent = '0x' + src2[i];
    if(srcUsed(i)){
      const [da, db] = dstOfPair(i);
      a.title = `src1[${i}] = 0x${src1[i]} → dst[${da}]${writes(da) ? '' : ' (masked off)'} — click to edit`;
      b.title = `src2[${i}] = 0x${src2[i]} → dst[${db}]${writes(db) ? '' : ' (masked off)'} — click to edit`;
    } else {
      a.title = `src1[${i}] = 0x${src1[i]} — high half of the lane, not read (that is what PUNPCKH${SZ.name} reads)`;
      b.title = `src2[${i}] = 0x${src2[i]} — high half of the lane, not read (that is what PUNPCKH${SZ.name} reads)`;
    }
  }

  for(let i=0; i<N; i++){
    const dEl = cells.dst[i];
    const s = dstStatus(i);
    let dcls;
    if(s.kind === 'val'){
      dcls = s.from === 'src1' ? 'dst-a' : 'dst-b';
      dEl._val.textContent = '0x' + s.val;
      dEl.title = `dst[${i}] = 0x${s.val} = ${s.from}[${s.j}]`;
    } else if(s.kind === 'zero'){
      dcls = 'dst-zer';
      dEl._val.textContent = zeroStr();
      dEl.title = `dst[${i}] = ${zeroStr()} (zeroed — k1 mask off)`;
    } else {
      dcls = 'dst-keep';
      dEl._val.textContent = '0x' + s.val;
      dEl.title = `dst[${i}] = 0x${s.val} (kept — k1 mask off)`;
    }
    dEl.className = 'cell ' + dcls;

    const kEl = cells.k1[i];
    const on = !!kmask[i];
    kEl.className = 'cell km-cell' + (on ? '' : ' km-off');
    kEl._val.textContent = on ? 1 : 0;
    kEl.title = `k1[${i}] = ${on?1:0} → ${on ? 'write' : (kmode==='zero' ? 'zero' : 'keep prior dst')}`;
  }
  refreshHover();
}

// The hovered *pair*: source index j whose two elements (src1[j], src2[j]) land
// side by side in dst. Hovering an idle (high-half) source element yields -1.
function hovPair(){
  if(hovDst >= 0) return srcOfDst(hovDst).j;
  if(hovK >= 0) return srcOfDst(hovK).j;
  const s = hovSrc1 >= 0 ? hovSrc1 : hovSrc2;
  return (s >= 0 && srcUsed(s)) ? s : -1;
}

function refreshHover(){
  const j = hovPair();
  const [da, db] = j >= 0 ? dstOfPair(j) : [-1, -1];
  for(let i=0; i<N; i++){
    cells.src1[i].classList.toggle('lit', i === j);
    cells.src2[i].classList.toggle('lit', i === j);
    const onPair = (i === da || i === db);
    const primary = (i === hovDst || i === hovK);
    cells.dst[i].style.boxShadow = (onPair && writes(i)) ? `0 0 0 ${primary ? 3 : 2}px #639922` : '';
    cells.k1[i].classList.toggle('active', onPair);
  }
}

// ─── Info box ───────────────────────────────────────────────────────────────
function resetInfo(){ document.getElementById('info').textContent = 'Hover over any cell to trace the interleave.'; }

// Description of a masked-off dst element (zeroed by {z} or kept from prior dst).
function maskedTail(i){
  return kmode === 'zero'
    ? `<strong>dst[${i}] = ${zeroStr()}</strong> (zeroed by {z})`
    : `<strong>dst[${i}] = 0x${dstPrev[i]}</strong> (kept — prior value)`;
}

function slotNote(i){
  const lane = laneOf(i), loc = locOf(i);
  const which = loc % 2 ? 'odd' : 'even';
  const laneTxt = N > LANE ? `lane ${lane}, ` : '';
  return `<span class="hint">(${laneTxt}${which} slot ${loc} of the lane)</span>`;
}

function updateInfo(){
  const box = document.getElementById('info');

  if(hovSrc1 >= 0 || hovSrc2 >= 0){
    const from = hovSrc1 >= 0 ? 'src1' : 'src2';
    const j = hovSrc1 >= 0 ? hovSrc1 : hovSrc2;
    const v = srcVal(from, j);
    if(!srcUsed(j)){
      const laneTxt = N > LANE ? `lane ${laneOf(j)}` : 'the register';
      box.innerHTML = `<strong>${from}[${j}] = 0x${v}</strong> — sits in the high half of ${laneTxt} (slot ${locOf(j)} &ge; ${HALF}), so <strong>PUNPCKL${SZ.name} never reads it</strong>. <code>PUNPCKH${SZ.name}</code> is the instruction that unpacks the high halves.`;
      return;
    }
    const [da, db] = dstOfPair(j);
    const d = from === 'src1' ? da : db;
    const other = from === 'src1' ? 'src2' : 'src1';
    const od = from === 'src1' ? db : da;
    const partner = writes(od)
      ? `paired with <strong>${other}[${j}] = 0x${srcVal(other, j)}</strong> &rarr; dst[${od}]`
      : `paired with <strong>${other}[${j}] = 0x${srcVal(other, j)}</strong>, whose slot dst[${od}] is masked off &rarr; ${maskedTail(od)}`;
    if(!writes(d)){
      box.innerHTML = `<strong>${from}[${j}] = 0x${v}</strong> would go to dst[${d}], but <strong>k1[${d}] = 0</strong> &rarr; ${maskedTail(d)} · ${partner}`;
      return;
    }
    box.innerHTML = `<strong>${from}[${j}] = 0x${v}</strong> &rarr; <strong>dst[${d}] = 0x${v}</strong> ${slotNote(d)} · ${partner}`;
    return;
  }

  if(hovK >= 0){
    const i = hovK, on = !!kmask[i];
    const { from, j } = srcOfDst(i);
    if(on){
      box.innerHTML = `<strong>k1[${i}] = 1</strong> — active · ${from}[${j}] = 0x${srcVal(from, j)} &rarr; <strong>dst[${i}] = 0x${srcVal(from, j)}</strong>`;
    } else {
      box.innerHTML = `<strong>k1[${i}] = 0</strong> — write suppressed · ${from}[${j}] = 0x${srcVal(from, j)} &rarr; ${maskedTail(i)}`;
    }
    return;
  }

  if(hovDst >= 0){
    const i = hovDst;
    const { from, j } = srcOfDst(i);
    if(!writes(i)){
      box.innerHTML = `<strong>k1[${i}] = 0</strong> — write suppressed &rarr; ${maskedTail(i)} · would have been ${from}[${j}] = 0x${srcVal(from, j)}`;
      return;
    }
    const other = from === 'src1' ? 'src2' : 'src1';
    const od = from === 'src1' ? i + 1 : i - 1;
    const neighbour = writes(od)
      ? `its neighbour dst[${od}] takes ${other}[${j}] = 0x${srcVal(other, j)}`
      : `its neighbour dst[${od}] is masked off &rarr; ${maskedTail(od)}`;
    box.innerHTML = `<strong>dst[${i}] = 0x${srcVal(from, j)}</strong> &larr; <strong>${from}[${j}]</strong> ${slotNote(i)} · ${neighbour}`;
    return;
  }

  resetInfo();
}

// ─── Popups ─────────────────────────────────────────────────────────────────
function openSrcPopup(arrName, i, el, grid){
  closePopup();
  const arr = arrName === 'src1' ? src1 : src2;
  const gRect = grid.getBoundingClientRect();
  const eRect = el.getBoundingClientRect();

  const pop = document.createElement('div');
  pop.className = 'popup'; pop.id = 'active-popup';
  pop.style.left = (eRect.left + eRect.width/2 - gRect.left) + 'px';
  // Sit just above the clicked cell's row — a source grid can wrap to several
  // rows, so the CSS `bottom:100%` (above the whole grid) would detach the popup.
  pop.style.bottom = (gRect.bottom - eRect.top + 6) + 'px';

  const lbl = document.createElement('div');
  lbl.className = 'popup-lbl'; lbl.textContent = `${arrName}[${i}]`;

  const inp = document.createElement('input');
  inp.type = 'text'; inp.value = '0x' + arr[i]; inp.placeholder = '0x' + '0'.repeat(hexW());
  inp.onkeydown = e => {
    if(e.key === 'Enter'){ commitSrc(arrName, i, inp.value); closePopup(); }
    if(e.key === 'Escape') closePopup();
  };

  const row = document.createElement('div'); row.className = 'popup-row';
  const btnOk = document.createElement('button');
  btnOk.textContent = 'Set';
  btnOk.onclick = () => { commitSrc(arrName, i, inp.value); closePopup(); };
  const btnX = document.createElement('button');
  btnX.textContent = 'Cancel'; btnX.style.color = 'var(--text3)';
  btnX.onclick = closePopup;
  row.appendChild(btnOk); row.appendChild(btnX);

  const qg = document.createElement('div'); qg.className = 'quick-grid';
  const quick = [
    ['0x' + fillHex(0x00), fillHex(0x00)],
    ['0x' + fillHex(0xFF), fillHex(0xFF)],
    ['0x' + fillHex(0x80), fillHex(0x80)],
    ['0x' + fillHex(0x7F), fillHex(0x7F)],
  ];
  for(const [label, v] of quick){
    const btn = document.createElement('button');
    btn.textContent = label;
    btn.onclick = () => { commitSrc(arrName, i, v); closePopup(); };
    qg.appendChild(btn);
  }
  // Whole-register zero: the zero-extension idiom needs every src2 element clear.
  const btnAll = document.createElement('button');
  btnAll.textContent = `zero all of ${arrName}`;
  btnAll.style.flex = 'unset';   // a direct child of the column-flex popup, not of .popup-row
  btnAll.onclick = () => { arr.fill(fillHex(0x00), 0, N); render(); drawArrows(); closePopup(); };

  pop.appendChild(lbl); pop.appendChild(inp); pop.appendChild(row); pop.appendChild(qg); pop.appendChild(btnAll);
  grid.appendChild(pop);
  setTimeout(() => inp.select(), 0);

  function outside(e){ if(!pop.contains(e.target) && e.target !== el){ closePopup(); } }
  pop._out = outside;
  document.addEventListener('mousedown', outside);
}

function commitSrc(arrName, i, raw){
  const v = normHex(raw);
  if(v === null) return;
  (arrName === 'src1' ? src1 : src2)[i] = v;
  render(); drawArrows();
}
function closePopup(){
  const p = document.getElementById('active-popup');
  if(p){ document.removeEventListener('mousedown', p._out); p.remove(); }
}

// ─── Arrows ─────────────────────────────────────────────────────────────────
// The hovered pair j gets two wires: src1[j] → dst[2j] (blue) and
// src2[j] → dst[2j+1] (teal). A wire to a masked-off slot is not drawn.
function drawArrows(){
  const canv = document.getElementById('arrows');
  const flow = document.getElementById('flow');
  if(!canv || !flow) return;
  const ctx = canv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = flow.offsetWidth, H = flow.offsetHeight;
  canv.width = W*dpr; canv.height = H*dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  const j = hovPair();
  if(j < 0) return;
  const [da, db] = dstOfPair(j);

  const cr = canv.getBoundingClientRect();
  function topPt(el){ const r = el.getBoundingClientRect(); return [r.left + r.width/2 - cr.left, r.top - cr.top]; }
  function botPt(el){ const r = el.getBoundingClientRect(); return [r.left + r.width/2 - cr.left, r.bottom - cr.top]; }

  for(const [cell, dst, color] of [[cells.src1[j], da, '#378ADD'], [cells.src2[j], db, '#2E8B87']]){
    if(!writes(dst)) continue;
    const [x1, y1] = botPt(cell);
    const [x2, y2] = topPt(cells.dst[dst]);
    const my = (y1 + y2) / 2;
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 1.75;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.bezierCurveTo(x1, my, x2, my, x2, y2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - 4, y2 - 7);
    ctx.lineTo(x2 + 4, y2 - 7);
    ctx.closePath();
    ctx.fill();
  }
}

// ─── Bootstrap ──────────────────────────────────────────────────────────────
const tabBar = document.getElementById('tabs');
for(const s of SIZES){
  const btn = document.createElement('button');
  btn.className = 'tab';
  btn.dataset.instr = s.key;
  btn.textContent = 'PUNPCKL' + s.name;
  btn.title = `PUNPCKL${s.name} / VPUNPCKL${s.name} — interleave low ${s.elemName}s (SSE2)`;
  btn.addEventListener('click', () => selectSize(s.key));
  tabBar.appendChild(btn);
}
window.addEventListener('hashchange', () => {
  const p = parseHash(location.hash.replace(/^#/, ''));
  if(p && p.key !== SZ.key) selectSize(p.key);
});
window.addEventListener('resize', drawArrows);

const initial = parseHash(location.hash.replace(/^#/, ''));
selectSize(initial ? initial.key : 'bw');
</script>
</body>
