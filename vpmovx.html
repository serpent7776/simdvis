<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPMOVSX / VPMOVZX family — Interactive Sign/Zero-Extend Visualisers</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg2: #f5f5f3;
    --bg3: #eeede8;
    --text: #1a1a18;
    --text2: #5f5e5a;
    --text3: #888780;
    --border: rgba(0,0,0,0.12);
    --border2: rgba(0,0,0,0.22);
    --font-mono: ui-monospace, 'Cascadia Code', 'Fira Mono', monospace;
    --font-sans: system-ui, -apple-system, sans-serif;
    --radius: 8px;
    --radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1c;
      --bg2: #272725;
      --bg3: #2e2e2c;
      --text: #e8e6df;
      --text2: #9c9a92;
      --text3: #6e6c66;
      --border: rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.2);
    }
  }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .card {
    background: var(--bg);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    width: 100%;
    max-width: 920px;
  }

  .tabs { display: flex; gap: 4px; margin-bottom: 1rem; flex-wrap: wrap; }
  .tab {
    font-size: 11px; padding: 5px 10px; border-radius: 6px;
    border: 0.5px solid var(--border); background: var(--bg2);
    color: var(--text2); cursor: pointer;
    font-family: var(--font-mono); font-weight: 500;
    transition: background .15s, border-color .15s, color .15s;
  }
  .tab:hover { background: var(--bg3); border-color: var(--border2); color: var(--text); }
  .tab.active {
    background: var(--bg); color: var(--text);
    border-color: var(--border2); font-weight: 600;
    box-shadow: inset 0 -2px 0 var(--text2);
  }

  .header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: .25rem; }
  .title { font-size: 15px; font-weight: 500; }
  .subtitle { font-size: 12px; color: var(--text2); margin-bottom: 1rem; }

  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 500; font-family: var(--font-mono); }
  .bb { background: #B5D4F4; color: #042C53; }
  .ba { background: #FAC775; color: #412402; }
  .bg { background: #C0DD97; color: #173404; }
  .br { background: #F7C1C1; color: #501313; }
  .bp { background: #D8C9F4; color: #2A1356; }
  .bz { background: #D3D1C7; color: #2C2C2A; }

  @media (prefers-color-scheme: dark) {
    .bb { background: #0C447C; color: #B5D4F4; }
    .ba { background: #633806; color: #FAC775; }
    .bg { background: #27500A; color: #C0DD97; }
    .br { background: #791F1F; color: #F7C1C1; }
    .bp { background: #3A2070; color: #D8C9F4; }
    .bz { background: #444441; color: #D3D1C7; }
  }

  .reg-grid { display: grid; grid-template-columns: repeat(var(--cols, 4), 1fr); column-gap: 3px; row-gap: 3px; }

  .cell {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 6px; border: 0.5px solid; font-family: var(--font-mono);
    font-size: 11px; font-weight: 500; transition: background .15s, box-shadow .15s;
    min-width: 0; position: relative; height: 46px;
  }
  .cell-idx { font-size: 9px; font-weight: 400; opacity: .55; margin-bottom: 1px; }
  .cell-val { font-size: 11px; line-height: 1; overflow: hidden; text-overflow: ellipsis; max-width: 100%; white-space: nowrap; }
  /* the high bits added by the extension, dimmed so the copied source bits stand out */
  .cell-val .ext { opacity: .4; font-weight: 400; }

  .src-cell  { background: #E6F1FB; border-color: #378ADD; color: #0C447C; cursor: pointer; }
  .src-cell:hover { background: #B5D4F4; }
  .src-cell.lit { background: #FAC775; border-color: #EF9F27; color: #412402; box-shadow: 0 0 0 2px #EF9F27; }

  .km-cell  { background: #EEE7FA; border-color: #8367C7; color: #2A1356; cursor: pointer; height: 32px; }
  .km-cell:hover { background: #D8C9F4; }
  .km-cell.km-off { background: #F1EFE8; border-color: #888780; color: #5F5E5A; }
  .km-cell.km-off:hover { background: #E4E1D5; }
  .km-cell.active { box-shadow: 0 0 0 2.5px #8367C7; }

  .dst-val  { background: #EAF3DE; border-color: #639922; color: #27500A; cursor: default; }
  .dst-zer  { background: #F1EFE8; border-color: #888780; color: #5F5E5A; cursor: default; }
  .dst-keep { background: #F4F0FA; border-color: #8367C7; color: #2A1356; cursor: default; }

  @media (prefers-color-scheme: dark) {
    .src-cell  { background: #0C447C; border-color: #378ADD; color: #B5D4F4; }
    .src-cell:hover { background: #185FA5; }
    .src-cell.lit { background: #633806; border-color: #EF9F27; color: #FAC775; box-shadow: 0 0 0 2px #EF9F27; }
    .km-cell  { background: #3A2070; border-color: #8367C7; color: #D8C9F4; }
    .km-cell:hover { background: #4F2D94; }
    .km-cell.km-off { background: #2C2C2A; border-color: #5F5E5A; color: #888780; }
    .km-cell.km-off:hover { background: #3A3A38; }
    .dst-val  { background: #27500A; border-color: #639922; color: #C0DD97; }
    .dst-zer  { background: #2C2C2A; border-color: #5F5E5A; color: #888780; }
    .dst-keep { background: #3A2070; border-color: #8367C7; color: #D8C9F4; }
  }

  .row-lbl { font-size: 11px; color: var(--text2); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .hint { font-size: 11px; color: var(--text3); }

  .flow { position: relative; }
  .flow canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
  .flow .reg-grid { position: relative; z-index: 1; }

  .info {
    font-size: 12px; color: var(--text2);
    background: var(--bg2); border: 0.5px solid var(--border);
    border-radius: var(--radius); padding: 9px 13px; line-height: 1.6; min-height: 40px;
    margin-top: .75rem;
  }
  .info strong { color: var(--text); }
  .info code { font-family: var(--font-mono); font-size: 11px; }

  select {
    font-size: 11px; padding: 2px 5px; border-radius: 5px;
    border: 0.5px solid var(--border2);
    background: var(--bg2); color: var(--text);
  }
  .ctl { font-size: 11px; color: var(--text2); display: flex; align-items: center; gap: 5px; }
  .ctl[hidden] { display: none; }

  .popup {
    position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    background: var(--bg); border: 0.5px solid var(--border2);
    border-radius: var(--radius); padding: 8px; z-index: 50;
    display: flex; flex-direction: column; gap: 5px; min-width: 160px;
    box-shadow: 0 4px 16px rgba(0,0,0,.12);
  }
  .popup-lbl { font-size: 10px; color: var(--text3); font-family: var(--font-mono); }
  .popup input[type=text] {
    font-family: var(--font-mono); font-size: 12px; width: 100%;
    padding: 4px 7px; border-radius: 4px; border: 0.5px solid var(--border2);
    background: var(--bg2); color: var(--text);
  }
  .popup-row { display: flex; gap: 4px; }
  .popup button {
    font-size: 11px; padding: 3px 8px; border-radius: 4px;
    border: 0.5px solid var(--border2); background: var(--bg2); color: var(--text);
    cursor: pointer; flex: 1;
  }
  .popup button:hover { background: var(--bg3); }
  .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
  .quick-grid button { font-size: 10px; font-family: var(--font-mono); padding: 2px 0; flex: unset; }

  footer {
    margin-top: 1.5rem; padding-top: 1rem;
    border-top: 0.5px solid var(--border);
    font-size: 11px; color: var(--text3);
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
  footer a { color: var(--text3); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  footer a:hover { color: var(--text2); }
  .gh-icon { width: 14px; height: 14px; fill: currentColor; }
</style>
</head>
<body>
<div class="card">

  <div class="tabs" id="tabs"></div>

  <div class="header">
    <span class="title" id="title"></span>
    <span class="badge bb" id="isa-badge"></span>
    <span class="badge bz" id="width-badge"></span>
    <span style="flex:1"></span>
    <label class="ctl" id="ext-ctl">
      Extend:
      <select id="ext" onchange="changeExtend(this.value)">
        <option value="sx">sign</option>
        <option value="zx">zero</option>
      </select>
    </label>
    <label class="ctl" id="width-ctl">
      Width:
      <select id="width" onchange="changeWidth(this.value)"></select>
    </label>
    <label class="ctl" id="kmode-ctl">
      Mask:
      <select id="kmode" onchange="changeKmaskMode(this.value)">
        <option value="off">none</option>
        <option value="merge">{k1} merge</option>
        <option value="zero">{k1}{z} zero</option>
      </select>
    </label>
  </div>
  <p class="subtitle" id="subtitle"></p>

  <div class="flow" id="flow">
    <div class="row-lbl"><span class="badge bb">src</span><span class="hint" id="src-hint"></span></div>
    <div class="reg-grid" id="src-grid"></div>
    <div style="height:46px"></div>
    <div id="kmask-row" hidden>
      <div class="row-lbl"><span class="badge bp">k1</span><span class="hint kmask-hint">click to toggle 0/1</span></div>
      <div class="reg-grid" id="kmask-grid"></div>
      <div style="height:8px"></div>
    </div>
    <div class="row-lbl"><span class="badge bg">dst</span><span class="hint" id="dst-hint"></span></div>
    <div class="reg-grid" id="dst-grid"></div>
    <canvas id="arrows"></canvas>
  </div>

  <div class="info" id="info">Hover over any cell to inspect the extension.</div>

  <footer>
    <a href="index.html">&larr; All visualisers</a>
    <a href="https://github.com/serpent7776/simdvis">
      <svg class="gh-icon" viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.64 7.64 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      simdvis
    </a>
    <a id="isa-ref" target="_blank" rel="noopener">Intel ISA reference ↗</a>
  </footer>
</div>

<script>
// ─── Instruction configurations ─────────────────────────────────────────────
// VPMOVSX (sign-extend) / VPMOVZX (zero-extend) read N packed small elements
// from the low part of the source and widen each one, 1:1, into a larger
// destination element:  dst[i] = extend(src[i]).
//
// A single page hosts one tab per source→dest size (BW/BD/BQ/WD/WQ/DQ); the
// sign-vs-zero choice is a selector (`ext`), so the same data can be flipped
// between VPMOVSX* and VPMOVZX* to compare the fill bits. Each of the twelve
// concrete instructions still has a deep-link hash (e.g. #vpmovsxbw).
//   src / dst : bytes per (narrow) source and (wide) destination element
//   name      : the two-letter size suffix, e.g. 'BW'
// Element values are stored as zero-padded hex strings (src*2 chars).
const SIZES = [
  { key:'bw', name:'BW', src:1, dst:2, srcName:'byte',  dstName:'word'  },
  { key:'bd', name:'BD', src:1, dst:4, srcName:'byte',  dstName:'dword' },
  { key:'bq', name:'BQ', src:1, dst:8, srcName:'byte',  dstName:'qword' },
  { key:'wd', name:'WD', src:2, dst:4, srcName:'word',  dstName:'dword' },
  { key:'wq', name:'WQ', src:2, dst:8, srcName:'word',  dstName:'qword' },
  { key:'dq', name:'DQ', src:4, dst:8, srcName:'dword', dstName:'qword' },
];
const SIZE_BY_KEY = {};
for(const s of SIZES) SIZE_BY_KEY[s.key] = s;

// Parse a deep-link hash like "vpmovsxbw" → { ext:'sx', key:'bw' }, or null.
function parseHash(h){
  const m = /^vpmov(sx|zx)(bw|bd|bq|wd|wq|dq)$/.exec(h);
  return m ? { ext: m[1], key: m[2] } : null;
}

// ─── State ──────────────────────────────────────────────────────────────────
let SZ;                      // current size descriptor from SIZES
let ext = 'sx';              // 'sx' = sign-extend, 'zx' = zero-extend
let signed = true;           // derived: ext === 'sx'
let N, LANE;                 // N = element count; LANE = dst elements per 128-bit lane
let kmode = 'off';
let src, kmask, dstPrev;
let hovSrc = -1, hovDst = -1, hovK = -1;
let cells;  // { src:[…], dst:[…], k1:[…] }

// ─── Instruction metadata (derived from SZ + ext) ───────────────────────────
function instrName(){ return 'vpmov' + ext + SZ.key; }               // vpmovsxbw
function instrTitle(){ return 'VPMOV' + ext.toUpperCase() + SZ.name; } // VPMOVSXBW
function instrRef(){ return 'https://www.felixcloutier.com/x86/' + (signed ? 'pmovsx' : 'pmovzx'); }
function instrSubtitle(){
  return signed
    ? `Sign-extend every ${SZ.srcName} of the packed source to a ${SZ.dstName} in the destination: <code>dst[i] = signext(src[i])</code>. The added high bits copy the source's top (sign) bit.`
    : `Zero-extend every ${SZ.srcName} of the packed source to a ${SZ.dstName} in the destination: <code>dst[i] = zeroext(src[i])</code>. The added high bits are cleared to <code>0</code>.`;
}
// word-producing form (BW) needs AVX-512BW at 512-bit; everything else AVX-512F
function feature512(){ return SZ.dst === 2 ? 'AVX-512BW' : 'AVX-512F'; }

// ─── Helpers ────────────────────────────────────────────────────────────────
function srcHexW(){ return SZ.src * 2; }
function dstHexW(){ return SZ.dst * 2; }
function zeroStr(){ return '0x' + '0'.repeat(dstHexW()); }
function keepFill(){ return 'CC'.repeat(SZ.dst); }
function quickFill(b){ return b.toString(16).toUpperCase().padStart(2, '0').repeat(SZ.src); }
function widthsFor(){ return [16 / SZ.dst, 32 / SZ.dst, 64 / SZ.dst]; }
function normHex(raw){
  const s = raw.trim().replace(/^0x/i, '');
  if(!/^[0-9a-fA-F]+$/.test(s) || s.length > srcHexW()) return null;
  return s.toUpperCase().padStart(srcHexW(), '0');
}

// A distinct, sign-alternating seed per source element so both sign-extension
// fills (0x00… and 0xFF…) are visible out of the box.
function seedHex(i){
  const w = srcHexW();
  let s = (i % 2 === 0) ? '9' : '3';           // top nibble: 9 = negative, 3 = positive
  for(let k = 1; k < w; k++) s += ((i + k) & 0xf).toString(16).toUpperCase();
  return s;
}

// Split the widened value of a source element into { fill, keep }:
//   keep = the original source bits, fill = the added high bits.
function dstParts(hex){
  const pad = dstHexW() - srcHexW();
  let fill;
  if(signed){
    const neg = parseInt(hex[0], 16) >= 8;      // top bit of the source element
    fill = (neg ? 'F' : '0').repeat(pad);
  } else {
    fill = '0'.repeat(pad);
  }
  return { fill, keep: hex };
}

function writes(i){ return !(kmode !== 'off' && !kmask[i]); }

// Wire hover on a cell: clear all hover state, set the one this cell owns, redraw.
function wireHover(el, setHov){
  el.addEventListener('mouseenter', () => { hovSrc=hovDst=hovK=-1; setHov(); refreshHover(); drawArrows(); updateInfo(); });
  el.addEventListener('mouseleave', () => { hovSrc=hovDst=hovK=-1; refreshHover(); drawArrows(); resetInfo(); });
}

// What ends up in dst[i]?
//   { kind:'val',  fill, keep } — widened source element
//   { kind:'zero' }             — masked out with {z}
//   { kind:'keep', val }        — masked out with merge, prior dst kept
function dstStatus(i){
  if(!writes(i)) return kmode === 'zero' ? { kind:'zero' } : { kind:'keep', val: dstPrev[i] };
  return Object.assign({ kind:'val' }, dstParts(src[i]));
}

function bitsTotal(){ return N * SZ.dst * 8; }
function srcBits(){ return N * SZ.src * 8; }
function regNameForBits(bits){ return bits === 128 ? 'XMM' : bits === 256 ? 'YMM' : 'ZMM'; }
function isaLabel(){
  const bits = bitsTotal();
  if(bits === 512) return feature512();
  if(kmode === 'off') return bits === 128 ? 'AVX' : 'AVX2';
  return feature512() + '+VL';
}
function widthLabel(){ const bits = bitsTotal(); return `${bits}-bit ${regNameForBits(bits)}`; }

// ─── Init / switching ───────────────────────────────────────────────────────
function initData(n){
  N = n;
  src     = Array.from({length:N}, (_,i) => seedHex(i));
  kmask   = Array.from({length:N}, () => 1);
  dstPrev = Array.from({length:N}, () => keepFill());
}

// Switch to a size tab (BW/BD/…). Keeps the current extend mode; resets data,
// width (widest) and mask.
function selectSize(key){
  SZ = SIZE_BY_KEY[key] || SIZES[0];
  signed = (ext === 'sx');
  LANE = 16 / SZ.dst;                 // dst elements per 128-bit lane
  N = widthsFor()[2];                 // default to the widest destination (512-bit)
  kmode = 'off';
  hovSrc = hovDst = hovK = -1;
  closePopup();
  initData(N);

  rebuildWidthOptions();
  document.getElementById('kmode').value = 'off';

  build();
  updatePresentation();
  render(); drawArrows();
}

// Flip sign ↔ zero extension in place — source data, width and mask are kept so
// the two fills can be compared on identical inputs.
function changeExtend(v){
  if(v === ext) return;
  ext = v; signed = (ext === 'sx');
  closePopup();
  updatePresentation();
  render(); drawArrows(); updateInfo();
}

// Refresh everything that depends on (SZ, ext, kmode) but not on cell geometry.
function updatePresentation(){
  const name = instrName();
  document.title = instrTitle() + ' — Interactive ' + (signed ? 'Sign' : 'Zero') + '-Extend Visualiser';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.instr === SZ.key));
  document.getElementById('ext').value = ext;
  document.getElementById('title').textContent = instrTitle();
  document.getElementById('subtitle').innerHTML = instrSubtitle();
  document.getElementById('isa-ref').href = instrRef();
  document.getElementById('dst-hint').textContent = `dst[i] = ${signed ? 'signext' : 'zeroext'}(src[i])`;
  syncBadges();
  if(location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
}

function rebuildWidthOptions(){
  const sel = document.getElementById('width');
  sel.innerHTML = '';
  for(const w of widthsFor()){
    const opt = document.createElement('option');
    opt.value = w;
    const bits = w * SZ.dst * 8;
    opt.textContent = `${regNameForBits(bits)} (${bits})`;
    sel.appendChild(opt);
  }
  sel.value = N;
}

function changeWidth(w){
  const newN = parseInt(w);
  if(newN === N) return;
  hovSrc = hovDst = hovK = -1;  // a stale index could exceed the shrunk element count
  const oldSrc = src.slice();
  const oldKmask = kmask.slice();
  const oldDstPrev = dstPrev.slice();
  initData(newN);
  // keep the user's edited source / mask toggles / prior-dst for elements that still exist
  for(let i=0; i<Math.min(newN, oldSrc.length); i++){
    src[i] = oldSrc[i];
    kmask[i] = oldKmask[i];
    dstPrev[i] = oldDstPrev[i];
  }
  build();
  syncBadges();
  render(); drawArrows();
}

function changeKmaskMode(m){
  if(m === kmode) return;
  kmode = m;
  document.getElementById('kmask-row').hidden = (kmode === 'off');
  updateKmaskHint();
  syncBadges();
  render(); drawArrows();
}

function updateKmaskHint(){
  const txt = kmode === 'zero'  ? `click to toggle 0/1 — 0 zeroes the output ${SZ.dstName}`
            : kmode === 'merge' ? `click to toggle 0/1 — 0 keeps the prior dst ${SZ.dstName}`
                                : 'click to toggle 0/1 — 1 = element active';
  document.querySelector('.kmask-hint').textContent = txt;
}

function syncBadges(){
  document.getElementById('isa-badge').textContent = isaLabel();
  document.getElementById('width-badge').textContent = widthLabel();
}

// ─── Construction ───────────────────────────────────────────────────────────
// Cells are built once per build() and cached in `cells`. render() updates only
// data-dependent attributes; refreshHover() updates only hover styling.
function makeCell(idxLabel){
  const el = document.createElement('div');
  el.innerHTML = `<span class="cell-idx">${idxLabel}</span><span class="cell-val"></span>`;
  el._val = el.lastChild;
  return el;
}

function build(){
  closePopup();
  cells = { src: [], dst: [], k1: [] };

  document.getElementById('src-hint').textContent =
    `${srcBits()}-bit packed source (${N} ${SZ.srcName}s) — click a ${SZ.srcName} to edit`;

  const srcG = document.getElementById('src-grid');
  srcG.style.setProperty('--cols', LANE);
  srcG.innerHTML = '';
  for(let i=0; i<N; i++){
    const el = makeCell(`[${i}]`);
    el.className = 'cell src-cell';
    el.onclick = () => openSrcPopup(i, el);
    wireHover(el, () => hovSrc=i);
    srcG.appendChild(el);
    cells.src.push(el);
  }

  const dstG = document.getElementById('dst-grid');
  dstG.style.setProperty('--cols', LANE);
  dstG.innerHTML = '';
  for(let i=0; i<N; i++){
    const el = makeCell(`[${i}]`);
    wireHover(el, () => hovDst=i);
    dstG.appendChild(el);
    cells.dst.push(el);
  }

  const kG = document.getElementById('kmask-grid');
  document.getElementById('kmask-row').hidden = (kmode === 'off');
  kG.style.setProperty('--cols', LANE);
  kG.innerHTML = '';
  for(let i=0; i<N; i++){
    const el = makeCell(`[${i}]`);
    el.onclick = () => { kmask[i] = kmask[i] ? 0 : 1; hovK = i; render(); drawArrows(); updateInfo(); };
    wireHover(el, () => hovK=i);
    kG.appendChild(el);
    cells.k1.push(el);
  }
  updateKmaskHint();
}

// ─── Rendering ──────────────────────────────────────────────────────────────
function valHTML(fill, keep){
  return '0x' + (fill ? `<span class="ext">${fill}</span>` : '') + keep;
}

function render(){
  for(let i=0; i<N; i++){
    const sEl = cells.src[i];
    sEl._val.textContent = '0x' + src[i];
    sEl.title = `src[${i}] = 0x${src[i]} — click to edit`;
  }

  for(let i=0; i<N; i++){
    const dEl = cells.dst[i];
    const s = dstStatus(i);
    let dcls;
    if(s.kind === 'val'){
      dcls = 'dst-val';
      dEl._val.innerHTML = valHTML(s.fill, s.keep);
      dEl.title = `dst[${i}] = 0x${s.fill}${s.keep} = ${signed?'sign':'zero'}-extend(src[${i}] = 0x${src[i]})`;
    } else if(s.kind === 'zero'){
      dcls = 'dst-zer';
      dEl._val.textContent = zeroStr();
      dEl.title = `dst[${i}] = ${zeroStr()} (zeroed — k1 mask off)`;
    } else {
      dcls = 'dst-keep';
      dEl._val.textContent = '0x' + s.val;
      dEl.title = `dst[${i}] = 0x${s.val} (kept — k1 mask off)`;
    }
    dEl.className = 'cell ' + dcls;

    const kEl = cells.k1[i];
    const on = !!kmask[i];
    kEl.className = 'cell km-cell' + (on ? '' : ' km-off');
    kEl._val.textContent = on ? 1 : 0;
    kEl.title = `k1[${i}] = ${on?1:0} → ${on ? 'extend' : (kmode==='zero' ? 'zero' : 'keep prior dst')}`;
  }
  refreshHover();
}

function refreshHover(){
  for(let i=0; i<N; i++){
    const lit = hovSrc === i || hovDst === i || hovK === i;
    cells.src[i].classList.toggle('lit', lit);
    cells.dst[i].style.boxShadow = (lit && writes(i)) ? '0 0 0 2.5px #639922' : '';
    cells.k1[i].classList.toggle('active', lit);
  }
}

// ─── Info box ───────────────────────────────────────────────────────────────
function resetInfo(){ document.getElementById('info').textContent = 'Hover over any cell to inspect the extension.'; }

// Description of a masked-off dst element (zeroed by {z} or kept from prior dst).
function maskedTail(i){
  return kmode === 'zero'
    ? `<strong>dst[${i}] = ${zeroStr()}</strong> (zeroed by {z})`
    : `<strong>dst[${i}] = 0x${dstPrev[i]}</strong> (kept — prior value)`;
}

// Sentence fragment describing what the extension does to src[i].
function extNote(i){
  const { fill, keep } = dstParts(src[i]);
  const verb = signed ? 'sign' : 'zero';
  const hiBytes = SZ.dst - SZ.src;
  const plural = hiBytes > 1 ? 's' : '';
  const why = signed
    ? (fill[0] === 'F' ? 'sign bit = 1' : 'sign bit = 0')
    : 'zero fill';
  return {
    full: fill + keep,
    tail: `high ${hiBytes} byte${plural} = 0x${fill} <span class="hint">(${why})</span>`,
    verb,
  };
}

function updateInfo(){
  const box = document.getElementById('info');

  if(hovSrc >= 0){
    const i = hovSrc;
    if(!writes(i)){
      box.innerHTML = `<strong>src[${i}] = 0x${src[i]}</strong> — the matching dst ${SZ.dstName} is masked off`;
      return;
    }
    const e = extNote(i);
    box.innerHTML = `<strong>src[${i}] = 0x${src[i]}</strong> → ${e.verb}-extend → <strong>dst[${i}] = 0x${e.full}</strong> · ${e.tail}`;
    return;
  }

  if(hovK >= 0){
    const i = hovK, on = !!kmask[i];
    if(on){
      const e = extNote(i);
      box.innerHTML = `<strong>k1[${i}] = 1</strong> — active · ${e.verb}-extend(src[${i}] = 0x${src[i]}) → <strong>dst[${i}] = 0x${e.full}</strong>`;
    } else {
      box.innerHTML = `<strong>k1[${i}] = 0</strong> — extension suppressed · src[${i}] = 0x${src[i]} → ${maskedTail(i)}`;
    }
    return;
  }

  if(hovDst >= 0){
    const i = hovDst;
    if(!writes(i)){
      box.innerHTML = `<strong>k1[${i}] = 0</strong> — extension suppressed → ${maskedTail(i)}`;
      return;
    }
    const e = extNote(i);
    box.innerHTML = `<strong>dst[${i}] = 0x${e.full}</strong> ← ${e.verb}-extend(src[${i}] = 0x${src[i]}) · ${e.tail}`;
    return;
  }

  resetInfo();
}

// ─── Popups ─────────────────────────────────────────────────────────────────
function openSrcPopup(i, el){
  closePopup();
  const grid = document.getElementById('src-grid');
  const gRect = grid.getBoundingClientRect();
  const eRect = el.getBoundingClientRect();

  const pop = document.createElement('div');
  pop.className = 'popup'; pop.id = 'active-popup';
  pop.style.left = (eRect.left + eRect.width/2 - gRect.left) + 'px';
  // Sit just above the clicked cell's row — the source grid can wrap to several
  // rows, so the CSS `bottom:100%` (above the whole grid) would detach the popup.
  pop.style.bottom = (gRect.bottom - eRect.top + 6) + 'px';

  const lbl = document.createElement('div');
  lbl.className = 'popup-lbl'; lbl.textContent = `src[${i}]`;

  const inp = document.createElement('input');
  inp.type = 'text'; inp.value = '0x' + src[i]; inp.placeholder = '0x' + '0'.repeat(srcHexW());
  inp.onkeydown = e => {
    if(e.key === 'Enter'){ commitSrc(i, inp.value); closePopup(); }
    if(e.key === 'Escape') closePopup();
  };

  const row = document.createElement('div'); row.className = 'popup-row';
  const btnOk = document.createElement('button');
  btnOk.textContent = 'Set';
  btnOk.onclick = () => { commitSrc(i, inp.value); closePopup(); };
  const btnX = document.createElement('button');
  btnX.textContent = 'Cancel'; btnX.style.color = 'var(--text3)';
  btnX.onclick = closePopup;
  row.appendChild(btnOk); row.appendChild(btnX);

  const qg = document.createElement('div'); qg.className = 'quick-grid';
  for(const b of [0x00, 0xFF, 0x80, 0x7F]){
    const v = quickFill(b);
    const btn = document.createElement('button');
    btn.textContent = '0x' + v;
    btn.onclick = () => { commitSrc(i, v); closePopup(); };
    qg.appendChild(btn);
  }

  pop.appendChild(lbl); pop.appendChild(inp); pop.appendChild(row); pop.appendChild(qg);
  grid.appendChild(pop);
  setTimeout(() => inp.select(), 0);

  function outside(e){ if(!pop.contains(e.target) && e.target !== el){ closePopup(); } }
  pop._out = outside;
  document.addEventListener('mousedown', outside);
}

function commitSrc(i, raw){
  const v = normHex(raw);
  if(v !== null){ src[i] = v; render(); drawArrows(); }
}
function closePopup(){
  const p = document.getElementById('active-popup');
  if(p){ document.removeEventListener('mousedown', p._out); p.remove(); }
}

// ─── Arrows ─────────────────────────────────────────────────────────────────
// One overlay canvas spans the whole flow area. Each source element maps 1:1 to
// the destination element directly below it, so arrows are near-vertical.
function drawArrows(){
  const canv = document.getElementById('arrows');
  const flow = document.getElementById('flow');
  if(!canv || !flow) return;
  const ctx = canv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = flow.offsetWidth, H = flow.offsetHeight;
  canv.width = W*dpr; canv.height = H*dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  // A single element index is highlighted at a time (1:1 mapping).
  let idx = -1;
  if(hovDst >= 0) idx = hovDst;
  else if(hovK >= 0) idx = hovK;
  else if(hovSrc >= 0) idx = hovSrc;
  if(idx < 0 || !writes(idx)) return;

  const cr = canv.getBoundingClientRect();
  function topPt(el){ const r = el.getBoundingClientRect(); return [r.left + r.width/2 - cr.left, r.top - cr.top]; }
  function botPt(el){ const r = el.getBoundingClientRect(); return [r.left + r.width/2 - cr.left, r.bottom - cr.top]; }

  ctx.strokeStyle = '#EF9F27'; ctx.fillStyle = '#EF9F27';
  ctx.lineWidth = 1.75;
  const [x1, y1] = botPt(cells.src[idx]);
  const [x2, y2] = topPt(cells.dst[idx]);
  const my = (y1 + y2) / 2;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.bezierCurveTo(x1, my, x2, my, x2, y2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - 4, y2 - 7);
  ctx.lineTo(x2 + 4, y2 - 7);
  ctx.closePath();
  ctx.fill();
}

// ─── Bootstrap ──────────────────────────────────────────────────────────────
const tabBar = document.getElementById('tabs');
for(const s of SIZES){
  const btn = document.createElement('button');
  btn.className = 'tab';
  btn.dataset.instr = s.key;
  btn.textContent = `${s.name[0]}→${s.name[1]}`;   // e.g. B→W
  btn.title = `VPMOVSX${s.name} / VPMOVZX${s.name} — ${s.srcName} → ${s.dstName}`;
  btn.addEventListener('click', () => selectSize(s.key));
  tabBar.appendChild(btn);
}
window.addEventListener('hashchange', () => {
  const p = parseHash(location.hash.replace(/^#/, ''));
  if(!p) return;
  if(p.key !== SZ.key){ ext = p.ext; selectSize(p.key); }
  else if(p.ext !== ext){ changeExtend(p.ext); }
});
window.addEventListener('resize', drawArrows);

const initial = parseHash(location.hash.replace(/^#/, ''));
ext = initial ? initial.ext : 'sx';
selectSize(initial ? initial.key : 'bw');
</script>
